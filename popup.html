<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TikTok Live Clicker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #22222e;
      --accent: #fe2c55;
      --accent-dim: #fe2c5520;
      --accent-glow: #fe2c5540;
      --green: #25f4ee;
      --green-dim: #25f4ee20;
      --text: #f0f0f5;
      --muted: #888899;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    body {
      width: 280px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      overflow: hidden;
      user-select: none;
    }

    /* Animated scanline bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.012) 2px,
        rgba(255,255,255,0.012) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .title-block h1 {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text);
      line-height: 1;
    }

    .title-block span {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.active {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.5s infinite;
    }

    .status-dot.error {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #status-text {
      color: var(--muted);
      font-size: 10px;
    }

    #status-text.active { color: var(--green); }
    #status-text.error { color: var(--accent); }

    /* URL warning */
    .url-warning {
      display: none;
      padding: 10px 12px;
      background: rgba(254, 44, 85, 0.08);
      border: 1px solid rgba(254, 44, 85, 0.3);
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 10px;
      color: var(--accent);
      line-height: 1.6;
      text-align: center;
    }

    .url-warning.show { display: block; }

    /* Progress section */
    .progress-section {
      margin-bottom: 16px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #count-label {
      color: var(--text);
      font-weight: 700;
    }

    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* Toggle button */
    .toggle-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 14px;
    }

    .toggle-wrap:hover:not(.disabled) {
      border-color: var(--accent);
      background: rgba(254, 44, 85, 0.04);
    }

    .toggle-wrap.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .toggle-label {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Toggle switch */
    .toggle-switch {
      width: 44px;
      height: 24px;
      background: var(--border);
      border-radius: 12px;
      position: relative;
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .toggle-switch.on {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .toggle-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .toggle-switch.on .toggle-knob {
      transform: translateX(20px);
    }

    /* Stats row */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .stat-val {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      margin-bottom: 3px;
    }

    .stat-val.highlight { color: var(--accent); }

    .stat-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Footer */
    .footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.5px;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="logo">🎵</div>
      <div class="title-block">
        <h1>Live Clicker</h1>
        <span>TikTok Auto Bot</span>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Checking page…</span>
    </div>

    <div class="url-warning" id="url-warning">
      ⚠ Open a TikTok Live stream first:<br>
      <code>tiktok.com/@username/live</code>
    </div>

    <div class="progress-section">
      <div class="progress-labels">
        <span>CLICKS</span>
        <span id="count-label">0 / 5000</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="toggle-wrap disabled" id="toggle-wrap">
      <span class="toggle-label" id="toggle-label">START CLICKER</span>
      <div class="toggle-switch" id="toggle-switch">
        <div class="toggle-knob"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-val highlight" id="stat-clicks">0</div>
        <div class="stat-label">Clicks</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-remaining">5000</div>
        <div class="stat-label">Remaining</div>
      </div>
    </div>

    <div class="footer">
      Only works on TikTok <strong>/@username/live</strong>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
