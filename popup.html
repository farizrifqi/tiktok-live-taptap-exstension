<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Live Clicker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e10;
      --surface: #161619;
      --surface-2: #1d1d21;
      --line: #26262b;
      --text: #ececf0;
      --muted: #7d7d88;
      --accent: #fe2c55;
      --accent-soft: rgba(254, 44, 85, 0.14);
      --ok: #4ade80;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .app { padding: 18px; display: flex; flex-direction: column; gap: 18px; }

    /* Status */
    .status {
      display: flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: 12px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }
    .dot.active { background: var(--ok); box-shadow: 0 0 0 0 rgba(74,222,128,.5); animation: ping 1.8s infinite; }
    .dot.error { background: var(--accent); }
    .dot.done { background: var(--ok); }
    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(74,222,128,.45); }
      70%, 100% { box-shadow: 0 0 0 7px rgba(74,222,128,0); }
    }
    #status-text { transition: opacity .2s var(--ease), transform .2s var(--ease); }
    #status-text.swap { opacity: 0; transform: translateY(2px); }
    .round {
      margin-left: auto; padding: 2px 8px; border-radius: 99px;
      background: var(--surface-2); color: var(--text); font-size: 11px;
      font-variant-numeric: tabular-nums;
      opacity: 0; transform: scale(.9);
      transition: opacity .3s var(--ease), transform .3s var(--ease);
    }
    .round.show { opacity: 1; transform: scale(1); }

    .warning {
      display: grid; grid-template-rows: 0fr;
      transition: grid-template-rows .35s var(--ease);
    }
    .warning > div {
      overflow: hidden; color: var(--muted); font-size: 12px; line-height: 1.5;
    }
    .warning.show { grid-template-rows: 1fr; }
    .warning code { color: var(--text); }

    /* Count */
    .count-wrap { display: flex; flex-direction: column; gap: 12px; }
    .count-row { display: flex; align-items: baseline; gap: 8px; }
    #count {
      font-size: 44px; font-weight: 600; letter-spacing: -0.03em; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .of { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

    .track { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
    .fill {
      height: 100%; width: 0%; background: var(--accent); border-radius: 3px;
      transition: width .35s var(--ease);
    }

    /* Settings */
    .group { display: flex; flex-direction: column; gap: 8px; }
    .label { color: var(--muted); font-size: 12px; }

    .stepper {
      display: flex; align-items: stretch;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      transition: border-color .25s var(--ease), box-shadow .25s var(--ease);
    }
    .stepper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .stepper button {
      width: 38px; background: none; border: 0; color: var(--muted);
      font-size: 16px; cursor: pointer; border-radius: 9px;
      transition: color .2s, background .2s, transform .15s var(--ease);
    }
    .stepper button:hover { color: var(--text); background: var(--surface-2); }
    .stepper button:active { transform: scale(.92); }
    #target {
      flex: 1; min-width: 0; text-align: center; background: none; border: 0; outline: 0;
      color: var(--text); font: inherit; font-size: 14px; font-weight: 500; padding: 10px 0;
      font-variant-numeric: tabular-nums; user-select: text; -moz-appearance: textfield;
    }
    #target::-webkit-outer-spin-button, #target::-webkit-inner-spin-button { -webkit-appearance: none; }

    .chips { display: flex; gap: 6px; }
    .chip {
      flex: 1; padding: 6px 0; background: none; color: var(--muted);
      border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 12px;
      cursor: pointer; font-variant-numeric: tabular-nums;
      transition: color .2s, border-color .2s, background .25s var(--ease), transform .15s var(--ease);
    }
    .chip:hover { color: var(--text); border-color: #3a3a41; }
    .chip:active { transform: scale(.95); }
    .chip.on { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

    .loop {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 12px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 10px; cursor: pointer;
      transition: border-color .25s var(--ease);
    }
    .loop:hover { border-color: #3a3a41; }
    .loop-title { font-size: 13px; }
    .loop-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .switch {
      width: 36px; height: 20px; border-radius: 10px; background: var(--line);
      position: relative; flex-shrink: 0; border: 0;
      transition: background .3s var(--ease);
    }
    .switch::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(16px); }

    /* Main button */
    #main-btn {
      position: relative; width: 100%; padding: 13px; border-radius: 12px;
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; overflow: hidden;
      transition: background .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease),
                  transform .15s var(--ease), opacity .3s var(--ease), box-shadow .3s var(--ease);
      box-shadow: 0 6px 20px -8px rgba(254,44,85,.6);
    }
    #main-btn:hover:not(:disabled) { transform: translateY(-1px); }
    #main-btn:active:not(:disabled) { transform: scale(.98); }
    #main-btn.running { background: transparent; border-color: var(--line); color: var(--text); box-shadow: none; }
    #main-btn.running:hover { border-color: #3a3a41; }
    #main-btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
    #main-btn span { display: inline-block; transition: opacity .2s var(--ease), transform .2s var(--ease); }
    #main-btn span.swap { opacity: 0; transform: translateY(4px); }

    button:focus-visible, .chip:focus-visible, .loop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">

    <div>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="status-text">Checking page…</span>
        <span class="round" id="round">Round 1</span>
      </div>
      <div class="warning" id="warning">
        <div><p style="padding-top:10px">Open a live stream first: <code>tiktok.com/@username/live</code></p></div>
      </div>
    </div>

    <section class="count-wrap">
      <div class="count-row">
        <span id="count">0</span>
        <span class="of" id="of">of 5,000</span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </section>

    <section class="group">
      <label class="label" for="target">Target clicks</label>
      <div class="stepper">
        <button type="button" id="minus" aria-label="Decrease target">−</button>
        <input id="target" type="number" min="1" max="1000000" step="1" value="5000" inputmode="numeric" />
        <button type="button" id="plus" aria-label="Increase target">+</button>
      </div>
      <div class="chips" id="chips">
        <button class="chip" data-v="100">100</button>
        <button class="chip" data-v="500">500</button>
        <button class="chip" data-v="1000">1k</button>
        <button class="chip" data-v="5000">5k</button>
      </div>
    </section>

    <div class="loop" id="loop-row">
      <div>
        <div class="loop-title">Repeat</div>
        <div class="loop-sub">Start over once the target is reached</div>
      </div>
      <button class="switch" id="loop" role="switch" aria-checked="false" aria-label="Repeat when target is reached"></button>
    </div>

    <button id="main-btn" disabled><span id="main-label">Start</span></button>

  </main>
  <script src="popup.js"></script>
</body>
</html>
